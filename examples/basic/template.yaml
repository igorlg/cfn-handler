AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Basic cfn-handler example - synchronous Create/Update/Delete custom resource.

Resources:
  CustomResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Architectures: [arm64]

  ExampleCustomResource:
    Type: Custom::Example
    Properties:
      ServiceToken: !GetAtt CustomResourceFunction.Arn
      Name: my-thing

Outputs:
  Endpoint:
    Value: !GetAtt ExampleCustomResource.Endpoint
  Status:
    Value: !GetAtt ExampleCustomResource.Status
