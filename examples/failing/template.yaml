AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: cfn-handler example - intentionally-failing handler demonstrating FAILED response semantics.

Resources:
  CustomResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Architectures: [arm64]

  ExampleFailingResource:
    Type: Custom::ExampleFailing
    Properties:
      ServiceToken: !GetAtt CustomResourceFunction.Arn
      Name: will-fail
