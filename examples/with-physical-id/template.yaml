AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: cfn-handler example - explicit physical_resource_id and replacement-on-update.

Resources:
  CustomResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Architectures: [arm64]

  Thing:
    Type: Custom::Thing
    Properties:
      ServiceToken: !GetAtt CustomResourceFunction.Arn
      Name: my-thing-v1

Outputs:
  Url:
    Value: !GetAtt Thing.Url
