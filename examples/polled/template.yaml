AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: cfn-handler polling example - long-running Create with poll handler.

Resources:
  CustomResourceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Architectures: [arm64]
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - events:PutRule
                - events:PutTargets
                - events:RemoveTargets
                - events:DeleteRule
                - lambda:AddPermission
                - lambda:RemovePermission
              Resource: '*'

  ExampleLongRunningResource:
    Type: Custom::ExampleLongRunning
    Properties:
      ServiceToken: !GetAtt CustomResourceFunction.Arn
      Name: my-long-job

Outputs:
  Endpoint:
    Value: !GetAtt ExampleLongRunningResource.Endpoint
