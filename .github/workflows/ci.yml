name: CI

# PR-only gating model. The post-merge `push: main` trigger was removed
# in `refactor-ci-triggers-and-protect-main` because branch protection on
# `main` requires `CI passed` to succeed before a merge, so re-running CI
# on the merge commit is redundant. See docs/CI.md "Triggers and
# concurrency" for the rationale.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR runs to save CI minutes. Every event is now a
# pull_request (no main-branch runs to protect against), so we can
# cancel-in-progress unconditionally.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cache and venv may live on different filesystems under `act`; copying
  # silences the noisy hardlink warning and is fine for our small dep set.
  UV_LINK_MODE: copy

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Workaround: under `act`, JS-action post steps run via `docker exec`
      # with a stripped PATH that doesn't include the acttoolcache dir where
      # Node lives. Real GH-hosted runners are unaffected.
      - name: act compat — expose node on standard PATH
        if: env.ACT == 'true'
        run: |
          set -eu
          NODE_BIN=$(find /opt/acttoolcache/node -name node -type f -executable 2>/dev/null | head -1)
          if [ -n "$NODE_BIN" ] && [ ! -e /usr/local/bin/node ]; then
            ln -sf "$NODE_BIN" /usr/local/bin/node
          fi
          node --version

      - name: Install uv with Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          # Distinct cache slot per-job: the lint job and the
          # test/py3.12/ubuntu-24.04 matrix entry would otherwise compute
          # the same key (same OS + Python + lockfile) and race.
          cache-suffix: test

      - name: Install dependencies
        # `--locked` validates that pyproject.toml and uv.lock agree before
        # installing. Release-please now keeps the cfn-handler self-version
        # entry in uv.lock in lockstep with pyproject.toml (see
        # release-please-config.json's extra-files block), so post-merge
        # CI on main no longer breaks under --locked. Bonus: contributors
        # who edit pyproject.toml deps without running `uv lock` are
        # caught by CI immediately.
        run: uv sync --locked --only-group test

      - name: Run tests with coverage
        # `coverage run -m pytest` (NOT `pytest --cov`): the pytest11
        # entry point in cfn_handler.testing.fixtures causes pytest to
        # import cfn_handler during plugin collection, BEFORE pytest-cov
        # attaches its instrumentation. Module-level code in __init__.py
        # then runs uninstrumented and the report shows artificial 0%
        # coverage on those lines, dropping aggregate to ~68%. Using
        # `coverage run` ensures coverage's tracer is active before any
        # imports. Same pattern as `just test-cov`.
        run: |
          uv run coverage run -m pytest
          uv run coverage xml
          uv run coverage report

      - name: Upload coverage to Codecov
        if: matrix.runner == 'ubuntu-24.04' && matrix.python == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: lint + typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: act compat — expose node on standard PATH
        if: env.ACT == 'true'
        run: |
          set -eu
          NODE_BIN=$(find /opt/acttoolcache/node -name node -type f -executable 2>/dev/null | head -1)
          if [ -n "$NODE_BIN" ] && [ ! -e /usr/local/bin/node ]; then
            ln -sf "$NODE_BIN" /usr/local/bin/node
          fi
          node --version

      - name: Install uv with Python 3.12
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true
          # See note in the test job: distinct cache slot avoids the
          # race with test (py3.12 / ubuntu-24.04).
          cache-suffix: lint

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff check
        run: uv run ruff check src tests examples

      - name: Ruff format --check
        run: uv run ruff format src tests examples --check

      - name: mypy strict
        run: uv run mypy src/cfn_handler

      - name: pyright strict
        run: uv run pyright src/cfn_handler

  # Sentinel aggregator: one required status check that succeeds only when
  # every dependent job is `success` or `skipped`. Branch protection points
  # at `CI passed` (this job) so adding/removing matrix entries or
  # supplementary jobs does not require updating the protection JSON.
  #
  # FOOTGUN: when adding a new job to this workflow, also add it to
  # `needs:` below — otherwise this job reports green even if the new job
  # fails. See docs/CI.md "Adding a new workflow" checklist.
  ci-pass:
    name: CI passed
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed (or were skipped)
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          for r in "$TEST_RESULT" "$LINT_RESULT"; do
            [[ "$r" == "success" || "$r" == "skipped" ]] || exit 1
          done
          echo "All CI jobs passed."
