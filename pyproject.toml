[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cfn-handler"
version = "1.2.0"
description = "Modern CloudFormation Custom Resource lifecycle handler for AWS Lambda"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Igor Londero Gentil" },
]
keywords = [
    "aws",
    "cloudformation",
    "cfn",
    "custom-resource",
    "lambda",
    "crhelper",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/igorlg/cfn-handler"
Repository = "https://github.com/igorlg/cfn-handler"
Issues = "https://github.com/igorlg/cfn-handler/issues"
Changelog = "https://github.com/igorlg/cfn-handler/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "moto[events,logs,awslambda]>=5",
    "boto3>=1.34",
]
lint = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pyright>=1.1",
    "boto3-stubs[events,logs,lambda]>=1.34",
    "cfn-lint>=1.43",
]
# `dev` is the meta-group installed by `uv sync` with no args.
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

# ---- Build ----------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/cfn_handler"]

[tool.hatch.build.targets.sdist]
include = [
    "src/cfn_handler",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CHANGELOG.md",
    "pyproject.toml",
]

# ---- Linting --------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "examples"]
extend-exclude = [".venv", "dist", "build", "openspec/changes/archive"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "PTH",  # use pathlib
    "TID",  # tidy imports
    "PT",   # pytest style
    "PYI",  # typing best practices
    "TC",   # flake8-type-checking
    "ANN",  # flake8-annotations (require type annotations)
    "D",    # pydocstyle (public API only)
]
ignore = [
    "ANN401",  # allow `Any` where genuinely needed (event payloads)
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D", "S101", "SIM117", "TC", "PT022", "PYI034", "SIM300"]
"examples/**" = ["ANN", "D", "INP001"]
"src/cfn_handler/_internal/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---- Type checking --------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["src/cfn_handler"]
strict = true
warn_unreachable = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
no_implicit_reexport = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src/cfn_handler"]
exclude = ["**/__pycache__", ".venv", "dist", "build"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"  # boto3 calls leak Unknown without stubs
reportUnknownVariableType = "warning"

# ---- Tests ----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests that use moto-mocked AWS services",
]
filterwarnings = [
    "error",
    # hypothesis emits an info-level warning about deadlines on slow CI; ignore it.
    "ignore::hypothesis.errors.NonInteractiveExampleWarning",
]

# ---- Coverage -------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src/cfn_handler"]
parallel = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"
